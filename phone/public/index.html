<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="cue9">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>cue9</title>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 1024 1024">
          <rect width="1024" height="1024" rx="228" fill="#000"/>
          <g transform="translate(132 132) scale(1.484375)">
            <g transform="rotate(-32 256 256)">
              <path d="M 398.472 345.026 A 168 168 0 1 1 398.472 166.974" fill="none" stroke="#fff" stroke-width="62" stroke-linecap="round"/>
              <ellipse cx="214" cy="236" rx="25" ry="38" fill="#fff"/>
              <ellipse cx="306" cy="224" rx="28" ry="42" fill="#fff"/>
            </g>
          </g>
          <circle cx="773.391" cy="773.391" r="34" fill="#FF6A00"/>
        </svg>
      </div>
      <div class="word">cue9</div>
      <button class="alerts" id="alerts" type="button" hidden>Enable alerts</button>
      <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">connecting</span></div>
    </header>
    <section class="alerts-banner" id="alertsBanner" aria-live="polite" hidden></section>
    <main class="main" id="main"></main>
    <footer class="footer" id="footer"></footer>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
